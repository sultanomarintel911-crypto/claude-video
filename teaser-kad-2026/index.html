<script>
// ───────── Teaser "Bukti Bertaburan" · Tokoh Murid 2026 · kad 3D + tipografi kinetik ─────────
// Kanvas 2D deterministik (window.render(t)). Kad ialah segi empat dalam ruang 3D, diunjur dengan transformasi afin per kad,
// disusun mengikut kedalaman. Setiap babak (2 bar @ 120 BPM) ialah satu formasi. Identiti dirahsiakan.
const W = 1920, H = 1080, FOC = 1150;
const cv = document.getElementById('c'), x = cv.getContext('2d');
const GOLD = '#F5C542', WHITE = '#F4F1EA', DIM = 'rgba(244,241,234,.55)';
let FILM, SEC, FR = 0, LAND, TEX = {}, BACK, NOISE = [], REC = null;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3), eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, eob = k => 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2);
const lerp = (a, b, k) => a + (b - a) * k, frac = v => v - Math.floor(v);
function rnd(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = i => frac(Math.sin(i * 127.1 + 311.7) * 43758.5453);

// ── Tekstur kad ──
const CW = 360, CH = 480;
function mk(w, h, draw, bg) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.save(); g.beginPath(); g.roundRect(0, 0, w, h, 26); g.clip(); if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); } draw(g, w, h);
  const s = g.createLinearGradient(0, 0, w, h); s.addColorStop(0, 'rgba(255,255,255,.22)'); s.addColorStop(.4, 'rgba(255,255,255,0)'); s.addColorStop(1, 'rgba(0,0,0,.18)'); g.fillStyle = s; g.fillRect(0, 0, w, h); g.restore();
  g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 2; g.beginPath(); g.roundRect(1, 1, w - 2, h - 2, 26); g.stroke(); return c; }
function grad(g, w, h, a, b, ang = 1) { const q = g.createLinearGradient(0, 0, w * ang, h); q.addColorStop(0, a); q.addColorStop(1, b); g.fillStyle = q; g.fillRect(0, 0, w, h); }
function T(g, s, X, Y, sz, c, w = 700, f = 'Disp', al = 'left') { g.font = `${w} ${sz}px ${f}`; g.fillStyle = c; g.textAlign = al; g.fillText(s, X, Y); }
function redact(g, X, Y, w, h, c = '#151515') { g.fillStyle = c; g.beginPath(); g.roundRect(X, Y, w, h, 4); g.fill(); }
function buildTex() {
  const R = rnd(9);
  TEX.rec = mk(CW, CH, (g, w, h) => { T(g, 'REKOD 2026', 28, 52, 22, '#222', 500, 'Mono'); for (let i = 0; i < 11; i++) { const y = 92 + i * 34; if (i === 2 || i === 6) { g.fillStyle = 'rgba(255,74,46,.55)'; g.fillRect(16, y - 6, w - 32, 28); } redact(g, 28, y, 80 + R() * 150, 16); g.fillStyle = '#777'; g.fillRect(w - 110, y + 4, 80, 8); } }, '#F1ECE0');
  TEX.dots = mk(CW, CH, (g, w, h) => { grad(g, w, h, '#1b1f2a', '#0c0e14'); for (let i = 0; i < 18; i++) { const cx = 60 + (i % 4) * 80, cy = 90 + Math.floor(i / 4) * 80; g.fillStyle = [0, 1, 2, 4, 5, 9].includes(i) ? '#FF4A2E' : WHITE; g.beginPath(); g.arc(cx, cy, 20, 0, 7); g.fill(); } T(g, '18', 28, h - 30, 44, GOLD); }, null);
  TEX.map = mk(480, 320, (g, w, h) => { grad(g, w, h, '#16306b', '#0b1530'); const P = (lo, la) => [w / 2 + (lo - 60) * w / 240, h / 2 - (la - 20) * w / 240];
    g.beginPath(); for (const f of LAND) { const gg = f.geometry, polys = gg.type === 'Polygon' ? [gg.coordinates] : gg.coordinates; for (const p of polys) for (const r of p) { r.forEach(([lo, la], i) => { const [px, py] = P(lo, la); i ? g.lineTo(px, py) : g.moveTo(px, py); }); g.closePath(); } }
    g.fillStyle = 'rgba(120,170,255,.35)'; g.fill('evenodd'); const [dx, dy] = P(103.42, 4.76); g.strokeStyle = '#FF4A2E'; g.lineWidth = 3; g.setLineDash([6, 5]);
    for (const p of [[103.82, 1.35], [121.47, 31.23], [28.98, 41.01], [-1.89, 52.49]]) { const [px, py] = P(...p); g.beginPath(); g.moveTo(dx, dy); g.quadraticCurveTo((dx + px) / 2, Math.min(dy, py) - 40, px, py); g.stroke(); g.fillStyle = '#FF4A2E'; g.beginPath(); g.arc(px, py, 6, 0, 7); g.fill(); } g.setLineDash([]); }, null);
  const num = (n, l, a, b) => mk(CW, CH, (g, w, h) => { grad(g, w, h, a, b); T(g, n, 26, 250, 210, WHITE); T(g, l, 30, 300, 30, 'rgba(255,255,255,.85)', 600); g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(30, h - 70, w - 60, 4); T(g, 'TM-26', 30, h - 32, 20, 'rgba(255,255,255,.8)', 500, 'Mono'); });
  TEX.n18 = num('18', 'penyertaan', '#7B5CFF', '#FF6FB5'); TEX.n06 = num('06', 'kebangsaan', '#FF4A2E', '#FF9A3D'); TEX.n04 = num('04', 'negara', '#2B6BFF', '#24C6A0'); TEX.n05 = num('05', 'jawatan', '#9B3DFF', '#3D7BFF');
  TEX.stripes = mk(CW, CH, (g, w, h) => { g.fillStyle = '#F1ECE0'; g.fillRect(0, 0, w, h); g.save(); g.translate(w / 2, h / 2); g.rotate(-.6); g.fillStyle = '#E8452C'; for (let i = -12; i < 12; i++) g.fillRect(i * 40, -500, 20, 1000); g.restore();
    g.fillStyle = '#F1ECE0'; g.beginPath(); g.arc(w / 2, h / 2, 92, 0, 7); g.fill(); g.strokeStyle = '#111'; g.lineWidth = 26; g.beginPath(); g.arc(w / 2, h / 2, 64, 0, 7); g.stroke(); });
  TEX.grid = mk(CW, CW, (g, w, h) => { g.fillStyle = '#10121a'; g.fillRect(0, 0, w, h); const C = ['#FF4A2E', '#F5C542', '#2B6BFF', '#24C6A0', '#FF6FB5', '#7B5CFF', '#F1ECE0']; for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) { g.fillStyle = C[(i * 3 + j * 5) % 7]; g.beginPath(); g.roundRect(30 + i * 62, 30 + j * 62, 52, 52, 8); g.fill(); } });
  TEX.q = mk(CW, 440, (g, w, h) => { g.fillStyle = '#F4F2EC'; g.fillRect(0, 0, w, h); const q = g.createRadialGradient(w / 2, 170, 10, w / 2, 170, 200); q.addColorStop(0, '#4a4060'); q.addColorStop(1, '#141218'); g.fillStyle = q; g.fillRect(22, 22, w - 44, w - 44); T(g, '?', w / 2, 250, 190, '#F4F1EA', 700, 'Disp', 'center'); T(g, 'SUBJEK · TM-26', w / 2, h - 34, 22, '#333', 500, 'Mono', 'center'); }, null);
  TEX.sulit = mk(CW, CH, (g, w, h) => { grad(g, w, h, '#F5C542', '#E39A2B'); T(g, 'FAIL', 30, 80, 40, '#3a2a08'); T(g, 'KES TM-26', 30, 120, 26, '#3a2a08', 500, 'Mono'); g.save(); g.translate(w / 2, h * .62); g.rotate(-.25); g.strokeStyle = '#C8281C'; g.lineWidth = 8; g.strokeRect(-130, -50, 260, 100); T(g, 'SULIT', 0, 30, 76, '#C8281C', 700, 'Disp', 'center'); g.restore(); });
  TEX.school = mk(480, 320, (g, w, h) => { grad(g, w, h, '#0E2A26', '#13493F'); T(g, 'SK SULTAN OMAR', 30, 90, 40, WHITE); T(g, 'DUNGUN · TERENGGANU', 30, 130, 22, 'rgba(255,255,255,.7)', 500, 'Mono'); T(g, '4.76°U  103.42°T', 30, h - 34, 22, GOLD, 500, 'Mono'); }, null);
  TEX.pin = mk(CW, CW, (g, w, h) => { grad(g, w, h, '#FF9A3D', '#FF4A2E'); g.fillStyle = WHITE; g.beginPath(); g.arc(w / 2, 150, 70, Math.PI, 0); g.lineTo(w / 2, 290); g.closePath(); g.fill(); g.fillStyle = '#FF4A2E'; g.beginPath(); g.arc(w / 2, 150, 28, 0, 7); g.fill(); });
  TEX.trophy = mk(CW, CH, (g, w, h) => { grad(g, w, h, '#3a2a08', '#151005'); const s = 1; g.fillStyle = GOLD; g.beginPath(); g.moveTo(110, 120); g.lineTo(250, 120); g.lineTo(235, 230); g.quadraticCurveTo(180, 290, 125, 230); g.closePath(); g.fill(); g.fillRect(168, 270, 24, 60); g.fillRect(130, 330, 100, 24);
    g.strokeStyle = GOLD; g.lineWidth = 12; g.beginPath(); g.arc(110, 165, 34, Math.PI * .5, Math.PI * 1.5); g.stroke(); g.beginPath(); g.arc(250, 165, 34, -Math.PI * .5, Math.PI * .5); g.stroke(); T(g, '2× JOHAN', 30, h - 40, 40, GOLD); });
  TEX.medal = mk(CW, CW, (g, w, h) => { grad(g, w, h, '#2B6BFF', '#7B5CFF'); g.fillStyle = '#E8452C'; g.beginPath(); g.moveTo(120, 30); g.lineTo(170, 30); g.lineTo(200, 160); g.lineTo(150, 160); g.fill(); g.fillStyle = WHITE; g.beginPath(); g.moveTo(240, 30); g.lineTo(190, 30); g.lineTo(160, 160); g.lineTo(210, 160); g.fill();
    g.fillStyle = '#C9873A'; g.beginPath(); g.arc(w / 2, 220, 80, 0, 7); g.fill(); T(g, '3', w / 2, 252, 90, '#5a3410', 700, 'Disp', 'center'); });
  TEX.chart = mk(CW, CW, (g, w, h) => { g.fillStyle = '#F4F1EA'; g.fillRect(0, 0, w, h); T(g, 'PERINGKAT', 26, 46, 20, '#333', 500, 'Mono'); [[6, '#FF4A2E'], [4, '#7B5CFF'], [3, '#2B6BFF'], [5, '#24C6A0']].forEach(([v, c], i) => { g.fillStyle = c; g.fillRect(40 + i * 75, 320 - v * 40, 50, v * 40); }); });
  TEX.sun = mk(CW, CH, (g, w, h) => { grad(g, w, h, '#7B5CFF', '#FF6FB5', 0); g.fillStyle = '#FFE6B0'; g.beginPath(); g.arc(w / 2, h * .55, 70, 0, 7); g.fill(); g.fillStyle = '#2a1840'; g.beginPath(); g.moveTo(0, h); g.lineTo(0, h * .7); g.lineTo(w * .35, h * .45); g.lineTo(w * .6, h * .68); g.lineTo(w * .78, h * .55); g.lineTo(w, h * .75); g.lineTo(w, h); g.fill(); });
  TEX.wave = mk(CW, CH, (g, w, h) => { grad(g, w, h, '#2B6BFF', '#1b3a9c'); g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 3; for (let k = 0; k < 9; k++) { g.beginPath(); for (let i = 0; i <= 40; i++) { const xx = i * w / 40, yy = 60 + k * 48 + Math.sin(i * .5 + k) * 14; i ? g.lineTo(xx, yy) : g.moveTo(xx, yy); } g.stroke(); } });
  TEX.aa = mk(CW, CW, (g, w, h) => { grad(g, w, h, '#F5C542', '#FF9A3D'); g.fillStyle = '#E8452C'; g.beginPath(); g.arc(w * .45, h * .42, 100, 0, 7); g.fill(); g.fillStyle = '#2B6BFF'; g.beginPath(); g.arc(w * .72, h * .3, 34, 0, 7); g.fill(); T(g, 'TM', 26, h - 30, 80, '#111'); });
  TEX.list = mk(CW, CH, (g, w, h) => { g.fillStyle = '#F4F1EA'; g.fillRect(0, 0, w, h); T(g, 'DIKETAHUI', 26, 50, 24, '#222', 500, 'Mono'); for (let i = 0; i < 6; i++) { const y = 90 + i * 56; g.strokeStyle = '#E8452C'; g.lineWidth = 5; g.beginPath(); g.moveTo(30, y + 10); g.lineTo(42, y + 22); g.lineTo(64, y - 4); g.stroke(); g.fillStyle = '#555'; g.fillRect(80, y + 4, 120 + (i * 47 % 140), 12); }
    T(g, 'NAMA ?', 30, h - 40, 36, '#E8452C'); });
  BACK = mk(CW, CH, (g, w, h) => { grad(g, w, h, '#1c1e26', '#0d0e12'); T(g, 'TM-26', w / 2, h / 2 + 12, 40, 'rgba(255,255,255,.22)', 700, 'Disp', 'center'); }, null);
}
const KEYS = ['rec', 'dots', 'map', 'n18', 'n06', 'n04', 'n05', 'stripes', 'grid', 'q', 'sulit', 'school', 'pin', 'trophy', 'medal', 'chart', 'sun', 'wave', 'aa', 'list'];
const texOf = i => { const n = KEYS.length; return TEX[KEYS[(((i * 7 + (i >> 2)) % n) + n) % n]]; };

async function boot() {
  FILM = await (await fetch('film.json')).json(); SEC = FILM.sections; window.DUR = FILM.dur;
  LAND = (await (await fetch('assets/ne_110m_land.geojson')).json()).features;
  await Promise.all(['700 40px Disp', '600 40px Disp', '500 20px Mono'].map(f => document.fonts.load(f)));
  buildTex();
  for (let gi = 0; gi < 6; gi++) { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const d = g.createImageData(256, 256), r = rnd(gi * 31 + 3);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 110; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); NOISE.push(c); }
  window.READY = true;
}

// ── 3D: vektor, putaran, unjuran kad ──
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sc = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
function rot(v, rx, ry, rz) { let [X, Y, Z] = v; let c = Math.cos(rz), s = Math.sin(rz); [X, Y] = [X * c - Y * s, X * s + Y * c];
  c = Math.cos(rx); s = Math.sin(rx); [Y, Z] = [Y * c - Z * s, Y * s + Z * c]; c = Math.cos(ry); s = Math.sin(ry); [X, Z] = [X * c + Z * s, -X * s + Z * c]; return [X, Y, Z]; }
let CAM = { p: [0, 0, 0], yaw: 0, pitch: 0, roll: 0 };
function view(p) { let v = [p[0] - CAM.p[0], p[1] - CAM.p[1], p[2] - CAM.p[2]]; let c = Math.cos(-CAM.yaw), s = Math.sin(-CAM.yaw); v = [v[0] * c + v[2] * s, v[1], -v[0] * s + v[2] * c];
  c = Math.cos(-CAM.pitch); s = Math.sin(-CAM.pitch); v = [v[0], v[1] * c - v[2] * s, v[1] * s + v[2] * c]; c = Math.cos(CAM.roll); s = Math.sin(CAM.roll); return [v[0] * c - v[1] * s, v[0] * s + v[1] * c, v[2]]; }
const proj = v => [W / 2 + FOC * v[0] / v[2], H / 2 - FOC * v[1] / v[2]];
// kad: {tex, p, u, v (vektor unit paksi), w, h, a}; u = kanan, v = ke bawah
function card(tex, p, rx = 0, ry = 0, rz = 0, s = 1, a = 1) { const w = (tex.width / CW) * 170 * s, h = (tex.height / CW) * 170 * s; return { tex, p, u: rot([1, 0, 0], rx, ry, rz), v: rot([0, -1, 0], rx, ry, rz), w, h, a }; }
function cardUV(tex, p, u, v, s = 1, a = 1) { return { tex, p, u, v, w: (tex.width / CW) * 170 * s, h: (tex.height / CW) * 170 * s, a }; }
function drawCards(list, fog = [2600, 5200], filt, both) {
  const L = []; for (const c of list) { const vp = view(c.p); if (vp[2] < 60) continue; if (filt && !filt(vp)) continue; L.push([vp[2], c]); }
  L.sort((a, b) => b[0] - a[0]);
  for (const [z, c] of L) {
    const tl = add(add(c.p, sc(c.u, -c.w / 2)), sc(c.v, -c.h / 2)), tr = add(tl, sc(c.u, c.w)), bl = add(tl, sc(c.v, c.h));
    const A = view(tl), B = view(tr), Cc = view(bl); if (A[2] < 40 || B[2] < 40 || Cc[2] < 40) continue;
    const [ax, ay] = proj(A), [bx, by] = proj(B), [cx, cy] = proj(Cc);
    const tex = c.tex, tw = tex.width, th = tex.height, det = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
    if (Math.abs(det) < 4) continue;
    const fa = c.a * (1 - seg(z, fog[0], fog[1]));
    if (fa <= .01) continue;
    x.save(); x.globalAlpha = fa; x.setTransform((bx - ax) / tw, (by - ay) / tw, (cx - ax) / th, (cy - ay) / th, ax, ay);
    x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 0;
    x.drawImage(det > 0 || both ? tex : BACK, 0, 0, tw, th, 0, 0, tw, th);
    const dk = seg(z, 900, fog[1]) * .55; if (dk > 0) { x.globalAlpha = fa * dk; x.fillStyle = '#05060a'; x.beginPath(); x.roundRect(0, 0, tw, th, 26); x.fill(); }
    x.restore();
  }
}

// ── Tipografi kinetik ──
function tw(s, sz, w = 700, f = 'Disp', ls = 0) { x.save(); x.font = `${w} ${sz}px ${f}`; x.letterSpacing = ls + 'px'; const r = x.measureText(s).width; x.restore(); return r; }
function words(s, X, Y, sz, t0, t, o = {}) {   // perkataan naik + kabur → tajam, berperingkat; keluar pudar
  if (t < t0) return; const ws = s.split(' '), al = o.al || 'left', w = o.w || 700, f = o.f || 'Disp', ls = o.ls || 0, out = o.out ? 1 - seg(t, o.out, o.out + .25) : 1;
  const full = tw(s, sz, w, f, ls); let cx = al === 'center' ? X - full / 2 : al === 'right' ? X - full : X; const sp = tw(' ', sz, w, f, ls);
  ws.forEach((wd, i) => { const k = seg(t, t0 + i * (o.st ?? .07), t0 + i * (o.st ?? .07) + .38); const e = eo(k), ww = tw(wd, sz, w, f, ls);
    if (k > 0) { x.save(); x.globalAlpha = e * out; x.font = `${w} ${sz}px ${f}`; x.letterSpacing = ls + 'px'; x.fillStyle = (o.hi && o.hi.includes(i)) ? GOLD : (o.c || WHITE);
      if (k < 1) x.filter = `blur(${(1 - e) * 14}px)`; x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 30; x.fillText(wd, cx, Y + (1 - e) * sz * .45); x.restore(); }
    cx += ww + sp; });
  if (REC && t > t0 + ws.length * .07 + .4) REC.push({ id: o.id || s, text: s });
}
function mono(s, X, Y, sz, a, c = DIM, al = 'left', ls = 3) { x.save(); x.globalAlpha = a; x.font = `500 ${sz}px Mono`; x.letterSpacing = ls + 'px'; x.fillStyle = c; x.textAlign = al; x.fillText(s, X, Y); x.restore(); }
function pill(s, X, Y, a, c = GOLD, tc = '#111') { if (a <= 0) return; x.save(); x.globalAlpha = a; x.font = '500 22px Mono'; x.letterSpacing = '2px'; const w = x.measureText(s).width + 44; x.fillStyle = c; x.beginPath(); x.roundRect(X - w / 2, Y - 24, w, 48, 24); x.fill(); x.fillStyle = tc; x.textAlign = 'center'; x.fillText(s, X, Y + 8); x.restore(); }
function bigCount(n, X, Y, sz, t0, t, c = WHITE, dur = .7) { if (t < t0) return; const k = seg(t, t0, t0 + dur), v = Math.round(n * eo(k)); const e = eob(seg(t, t0, t0 + .45));
  x.save(); x.font = `700 ${sz}px Disp`; x.letterSpacing = '-6px'; x.fillStyle = c; x.globalAlpha = seg(t, t0, t0 + .12); x.translate(X, Y); x.scale(lerp(.7, 1, e), lerp(.7, 1, e)); x.shadowColor = c === GOLD ? 'rgba(245,197,66,.35)' : 'rgba(0,0,0,.5)'; x.shadowBlur = 50; x.fillText(String(v).padStart(2, '0'), 0, 0); x.restore(); }
function scrim(X, Y, R, a = .55) { const g = x.createRadialGradient(X, Y, 0, X, Y, R); g.addColorStop(0, `rgba(4,5,8,${a})`); g.addColorStop(1, 'rgba(4,5,8,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H); }

// ── Latar setiap babak ──
const BGC = { spiral: ['#123a40', '#05080a'], marquee: ['#3c1626', '#07060a'], tunnel: ['#16204a', '#05060c'], stacks: ['#2c1a48', '#07060c'], carpet: ['#3a2c10', '#080604'],
  window: ['#0f3530', '#040807'], ring: ['#2a3212', '#060704'], single: ['#1c1a46', '#05050c'], sphere: ['#2c1a4a', '#06050c'], end: ['#1a1238', '#030308'] };
function bg(k, t) { const [a, b] = BGC[k]; const g = x.createRadialGradient(W * .5 + Math.sin(t * .3) * 120, H * .4, 50, W * .5, H * .5, W * .75); g.addColorStop(0, a); g.addColorStop(1, b); x.fillStyle = g; x.fillRect(0, 0, W, H); }

// ═════════ Babak ═════════
const N = 90;
function sSpiral(t, l) {
  CAM = { p: [0, 0, lerp(-500, 0, eo(seg(l, 0, 1.2)))], yaw: 0, pitch: 0, roll: -.08 };
