<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #02040a; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- Pembuka bab 04 // PENCAPAIAN: terbang melalui terowong foto pencapaian SKeSO -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.2" data-width="1920" data-height="1080">
      <div
        id="terowong"
        class="clip"
        data-composition-id="gallery-tunnel"
        data-composition-src="compositions/gallery-tunnel.html"
        data-start="0" data-duration="4.2" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080"
        style="--images: assets/dscf2468.jpg, assets/dscf2470.jpg, assets/dscf2473.jpg, assets/terafecta_1.jpg, assets/terafecta_2.jpg, assets/terafecta_3.jpg, assets/terafecta_4.jpg, assets/badge.png; --imagemix: 0.8; --fill: 0.7; --speed: 4.2; --palette: #FFC83D, #38E8FF, #123A7A, #1E9E55, #8A4DFF, #E8A93A; --edgecolor: #38E8FF; --edgeopacity: 0.45; --backdrop: #02040a; --fog: 12"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
