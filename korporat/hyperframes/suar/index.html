<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- Suar anamorfik (garis cahaya mendatar kanta sinema), latar hitam untuk adunan 'screen' -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div
        id="suar"
        class="clip"
        data-composition-id="vfx-anamorphic-flare"
        data-composition-src="compositions/vfx-anamorphic-flare.html"
        data-start="0" data-duration="8" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080"
        style="--intensity: 4; --emitters: 34; --streaklength: 1.6; --timescale: 0.35; --backdrop: #000000"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
